<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MONO Messenger</title>
    <style>
        :root { --bg: #EFE9E1; --clay: #B85C38; --ink: #262220; --green: #4A7C59; }
        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--ink); height: 100vh; display: flex; overflow: hidden; }
        
        /* Сайдбар со списком юзеров */
        #sidebar { width: 280px; background: white; border-right: 1px solid rgba(0,0,0,0.1); display: flex; flex-direction: column; }
        .user-item { padding: 15px; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: 0.2s; }
        .user-item:hover, .user-item.active { background: #f5f5f5; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: #ddd; }
        
        /* Основная область чата */
        #main { flex: 1; display: flex; flex-direction: column; position: relative; }
        #chat-header { padding: 20px; border-bottom: 1px solid rgba(0,0,0,0.1); font-weight: bold; }
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        
        .msg { max-width: 70%; padding: 10px 15px; border-radius: 12px; background: white; align-self: flex-start; }
        .msg.my { background: var(--clay); color: white; align-self: flex-end; }
        
        #input-area { padding: 20px; background: white; display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 8px; outline: none; }
        button { background: var(--ink); color: white; border: none; padding: 0 20px; border-radius: 8px; cursor: pointer; }

        /* Экран входа */
        #login-screen { position: absolute; inset: 0; background: var(--bg); z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .hidden { display: none !important; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Экран входа -->
    <div id="login-screen">
        <h1 style="font-family: 'Playfair Display'; font-size: 3em;">MONO</h1>
        <input type="text" id="usernameInput" placeholder="Ваше имя" style="margin: 10px; width: 250px;">
        <input type="file" id="avatarInput" accept="image/*" style="margin: 10px;">
        <button onclick="joinChat()" style="padding: 10px 30px;">Войти в тишину</button>
    </div>

    <!-- Интерфейс мессенджера -->
    <div id="sidebar">
        <div style="padding: 20px; font-weight: bold; border-bottom: 1px solid #eee;">Люди</div>
        <div id="user-list"></div>
    </div>

    <div id="main">
        <div id="chat-header">Общий чат</div>
        <div id="messages"></div>
        <div id="input-area">
            <input type="text" id="msgInput" placeholder="Сообщение...">
            <button onclick="send()">➤</button>
        </div>
    </div>

<script>
    let socket;
    let myId;
    let currentRoom = 'global';
    let myAvatar = '';

    function joinChat() {
        const name = document.getElementById('usernameInput').value;
        const fileInput = document.getElementById('avatarInput');
        
        if (!name) return alert('Введите имя');

        if (fileInput.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                myAvatar = e.target.result;
                initSocket(name);
            };
            reader.readAsDataURL(fileInput.files[0]);
        } else {
            initSocket(name);
        }
    }

    function initSocket(name) {
        socket = new WebSocket(`wss://${window.location.host}`);
        
        socket.onopen = () => {
            socket.send(JSON.stringify({ type: 'join', name: name, avatar: myAvatar }));
            document.getElementById('login-screen').classList.add('hidden');
        };

        socket.onmessage = (event) => {
            const data = JSON.parse(event.data);
            
            if (data.type === 'welcome') {
                myId = data.userId;
                renderUsers(data.users);
            }
            if (data.type === 'userJoined') {
                addUserToList(data.user);
            }
            if (data.type === 'newMessage') {
                if (data.data.roomId === currentRoom || !data.data.roomId) {
                    renderMessage(data.data);
                }
            }
        };
    }

    function renderUsers(users) {
        const list = document.getElementById('user-list');
        list.innerHTML = '';
        users.forEach(u => addUserToList(u));
    }

    function addUserToList(u) {
        const list = document.getElementById('user-list');
        const div = document.createElement('div');
        div.className = 'user-item';
        div.innerHTML = `<img src="${u.avatar || ''}" class="avatar"><span>${u.name}</span>`;
        div.onclick = () => startPrivateChat(u);
        list.appendChild(div);
    }

    function startPrivateChat(user) {
        currentRoom = `private_${myId}_${user.id}`;
        document.getElementById('chat-header').innerText = `Личное с ${user.name}`;
        document.getElementById('messages').innerHTML = ''; // Очистка для простоты
    }

    function renderMessage(msg) {
        const div = document.createElement('div');
        div.className = `msg ${msg.senderId === myId ? 'my' : ''}`;
        div.innerText = msg.text;
        document.getElementById('messages').appendChild(div);
        document.getElementById('messages').scrollTop = 10000;
    }

    function send() {
        const input = document.getElementById('msgInput');
        if (input.value.trim() && socket) {
            socket.send(JSON.stringify({ 
                type: 'message', 
                text: input.value, 
                senderId: myId, 
                roomId: currentRoom 
            }));
            input.value = '';
        }
    }
    
    document.getElementById('msgInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') send();
    });
</script>
</body>
</html>
