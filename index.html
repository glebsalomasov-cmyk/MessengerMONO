<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MONO Messenger</title>
    <style>
        :root {
            --bg: #EFE9E1;
            --clay: #B85C38;
            --ink: #262220;
            --green: #4A7C59;
        }
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--ink);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }
        h1 { font-family: 'Playfair Display', serif; margin: 0; }
        
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 12px;
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            align-self: flex-start;
        }
        .message.my {
            align-self: flex-end;
            background-color: var(--clay);
            color: white;
        }
        .meta { font-size: 0.7em; opacity: 0.7; margin-bottom: 4px; }
        
        #input-area {
            padding: 20px;
            background: white;
            display: flex;
            gap: 10px;
            border-top: 1px solid rgba(0,0,0,0.1);
        }
        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
        }
        button {
            background-color: var(--ink);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
    <!-- Подключаем шрифты -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
</head>
<body>

<header>
    <h1>MONO</h1>
    <p style="font-size: 0.8em; opacity: 0.6;">Тишина. Честность. Глина.</p>
</header>

<div id="chat-container"></div>

<div id="input-area">
    <input type="text" id="msgInput" placeholder="Напишите сообщение...">
    <button onclick="sendMessage()">➤</button>
</div>

<script>
    const socket = new WebSocket(`wss://${window.location.host}`);
    const chatContainer = document.getElementById('chat-container');
    const msgInput = document.getElementById('msgInput');
    
    // Генерируем случайное имя для сессии
    const userName = "Гость " + Math.floor(Math.random() * 1000);

    socket.onopen = () => {
        console.log("Connected to MONO");
    };

    socket.onmessage = (event) => {
        const data = JSON.parse(event.data);
        
        if (data.type === 'history') {
            data.data.forEach(msg => renderMessage(msg));
        } else if (data.type === 'newMessage') {
            renderMessage(data.data);
        }
    };

    function renderMessage(msg) {
        const div = document.createElement('div');
        div.className = `message ${msg.user === userName ? 'my' : ''}`;
        div.innerHTML = `<div class="meta">${msg.user} • ${msg.time}</div>${msg.text}`;
        chatContainer.appendChild(div);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function sendMessage() {
        const text = msgInput.value.trim();
        if (text && socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify({ type: 'message', text: text, user: userName }));
            msgInput.value = '';
        }
    }

    msgInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
</script>

</body>
</html>
